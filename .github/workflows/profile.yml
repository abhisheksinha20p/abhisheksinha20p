name: Profile assets

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/skills.json"
      - "assets/projects.json"
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # METRICS_TOKEN (optional PAT with read:user) lets the calendar include
      # private contributions; the built-in token only sees public activity.
      - name: Build radar, cards and activity wave
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          USER_NAME="${{ github.repository_owner }}"
          python scripts/radar.py --data assets/skills.json -o assets/radar
          python scripts/radar.py --github "$USER_NAME" -o assets/radar-langs
          python scripts/cards.py --user "$USER_NAME" --projects assets/projects.json --out assets
          python scripts/activity.py --user "$USER_NAME"

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet || git commit -m "chore: refresh profile assets"
          git push
