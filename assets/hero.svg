<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-label="Abhishek Sinha — Web and Mobile App Developer">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF">
        <animate attributeName="stop-color" values="#2DD4BF;#38BDF8;#8B7CF6;#2DD4BF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#8B7CF6">
        <animate attributeName="stop-color" values="#8B7CF6;#2DD4BF;#38BDF8;#8B7CF6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2DD4BF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8B7CF6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1F2A37" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="320" rx="20" fill="#0D1117"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="20" fill="none" stroke="#1F2A37" stroke-width="1.5"/>

  <!-- drifting halo -->
  <circle cx="300" cy="160" r="260" fill="url(#halo)">
    <animate attributeName="cx" values="300;900;300" dur="14s" repeatCount="indefinite"/>
  </circle>

  <!-- floating code particles -->
  <g fill="url(#brand)" font-family="monospace" font-size="16" opacity="0.5">
    <text x="120" y="300">&lt;/&gt;
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -300" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="520" y="320">{ }
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -340" dur="11s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="11s" begin="2s" repeatCount="indefinite"/>
    </text>
    <text x="760" y="320">( )
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -330" dur="10s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="10s" begin="1s" repeatCount="indefinite"/>
    </text>
    <text x="1010" y="320">;
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -320" dur="8s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="8s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="1120" y="300">01
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -300" dur="12s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="12s" begin="4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- prompt line -->
  <text x="70" y="96" font-family="monospace" font-size="20" fill="#5B6876">
    <tspan fill="#2DD4BF">~/</tspan> whoami
  </text>

  <!-- name: slides up and fades in -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 24" to="0 0" dur="0.9s" fill="freeze"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" fill="freeze"/>
    <text x="68" y="178" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="url(#brand)">Abhishek Sinha</text>
  </g>

  <!-- title + blinking cursor: fade in after name -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.8s" fill="freeze"/>
    <text x="70" y="226" font-family="monospace" font-size="27" font-weight="600" fill="#C9D4E0">Web &amp; Mobile App Developer</text>
    <rect x="482" y="205" width="13" height="26" fill="#2DD4BF">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- animated underline sweep -->
  <rect x="70" y="250" width="420" height="3" rx="1.5" fill="url(#glow)">
    <animate attributeName="width" from="0" to="420" begin="1.1s" dur="1s" fill="freeze"/>
  </rect>

  <!-- tech chips: staggered slide-in -->
  <g font-family="monospace" font-size="15" fill="#A7B4C2">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="-12 0" to="0 0" begin="1.4s" dur="0.5s" fill="freeze"/>
      <rect x="70" y="276" width="104" height="30" rx="15" fill="#161B22" stroke="#2A3542"/>
      <text x="122" y="296" text-anchor="middle">React</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.55s" dur="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="-12 0" to="0 0" begin="1.55s" dur="0.5s" fill="freeze"/>
      <rect x="186" y="276" width="150" height="30" rx="15" fill="#161B22" stroke="#2A3542"/>
      <text x="261" y="296" text-anchor="middle">React Native</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="-12 0" to="0 0" begin="1.7s" dur="0.5s" fill="freeze"/>
      <rect x="348" y="276" width="118" height="30" rx="15" fill="#161B22" stroke="#2A3542"/>
      <text x="407" y="296" text-anchor="middle">Node.js</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.85s" dur="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="-12 0" to="0 0" begin="1.85s" dur="0.5s" fill="freeze"/>
      <rect x="478" y="276" width="140" height="30" rx="15" fill="#161B22" stroke="#2A3542"/>
      <text x="548" y="296" text-anchor="middle">TypeScript</text>
    </g>
  </g>

  <!-- rotating orbit emblem on the right -->
  <g transform="translate(990 160)">
    <circle r="92" fill="none" stroke="#1F2A37" stroke-width="1.5"/>
    <circle r="64" fill="none" stroke="#1F2A37" stroke-width="1.5"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      <circle cx="92" cy="0" r="6" fill="#2DD4BF"/>
      <circle cx="-92" cy="0" r="4" fill="#8B7CF6"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
      <circle cx="0" cy="64" r="5" fill="#38BDF8"/>
    </g>
    <text font-family="monospace" font-size="34" font-weight="700" fill="url(#brand)" text-anchor="middle" dy="12">&lt;/&gt;</text>
  </g>
</svg>
