<svg xmlns="http://www.w3.org/2000/svg" width="900" height="16" viewBox="0 0 900 16" fill="none" role="presentation">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2DD4BF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8B7CF6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="7" width="900" height="2" rx="1" fill="url(#line)"/>
  <circle cy="8" r="7" fill="url(#dot)">
    <animate attributeName="cx" values="60;840;60" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="7;10;7" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
